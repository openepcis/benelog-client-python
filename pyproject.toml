[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benelog-client"
version = "0.1.0.dev0"
description = "benelog platform client: core transport and auth, master data publication, GS1 key registry"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "benelog GmbH & Co. KG" }]
# 3.10 is the oldest interpreter current Odoo supports; ERPNext (Frappe 15+)
# requires 3.10 as well, so this is the floor both hosts share.
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# The canonical CBV event hash — the eventID of every event this client builds.
# An extra rather than a dependency, because the library's one hard requirement
# is `requests` (which Odoo ships anyway) and a host that only publishes master
# data has no use for a hash generator. Pinned exactly: 1.9.3 canonicalises
# under CBV 2.0, the same version the Java side is pinned to, and a version
# that canonicalised differently would rename every event.
#
# It is not a small extra. It pulls PyLD (and with it frozendict, cachetools,
# lxml) and declares Flask, the last without a single import in the package's
# own code. In a plain virtualenv that is merely wasteful. In the Odoo image it
# is not installable at all: Flask wants a newer Werkzeug than the Debian one
# Odoo runs on, and pip cannot uninstall a Debian-packaged distribution. There
# the package is installed with --no-deps beside PyLD and dateutil — see
# docker/demo/Containerfile in openepcis-odoo.
hash = [
    "epcis-event-hash-generator==1.9.3",
]
dev = [
    "pytest>=8",
    "mypy>=1.14",
    "types-requests",
    "ruff==0.16.2",
    "reuse>=5",
    "pip-licenses>=5",
    "epcis-event-hash-generator==1.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benelog_client"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Pinned so the format gate is reproducible. A different ruff reformats files
# nobody touched and turns an unrelated push red. Raising this is a deliberate
# act: bump it, run `ruff format`, commit the churn as its own change.
required-version = "==0.16.2"

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["benelog_client"]
mypy_path = "src"

# The hash generator ships no py.typed and is untyped throughout. Its two
# entry points are wrapped in one function here, and what they answer is
# checked at runtime rather than by the type checker.
[[tool.mypy.overrides]]
module = ["epcis_event_hash_generator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
